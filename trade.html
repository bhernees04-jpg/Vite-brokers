<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trade — Meridian</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topline">
      <div>
        <h1 id="symbol-heading">Trade</h1>
        <div class="sub" id="symbol-sub">&nbsp;</div>
      </div>
    </div>

    <div class="trade-grid">
      <div class="card">
        <div class="stat-label">Live price</div>
        <div class="stat-value mono" id="live-price" style="font-size:32px;">—</div>
        <div class="stat-delta mono" id="live-change"></div>
      </div>

      <div class="card">
        <div class="side-toggle">
          <button id="buy-tab" class="active-buy">Buy</button>
          <button id="sell-tab">Sell</button>
        </div>
        <div class="error-banner" id="error-banner"></div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" min="0" step="any" placeholder="0.00" />
        </div>
        <div class="order-summary-row"><span>Est. price</span><strong id="summary-price">—</strong></div>
        <div class="order-summary-row"><span>Est. total</span><strong id="summary-total">—</strong></div>
        <div class="order-summary-row"><span>Cash available</span><strong id="summary-cash">—</strong></div>
        <button id="submit-order" class="btn btn-buy btn-block" style="margin-top:0.8em;">Review &amp; place buy order</button>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const symbol = params.get('symbol') || 'BTC-USD';
  let side = 'buy';
  let currentPrice = 0;
  let baseCurrency = 'USD';
  let cashBalance = 0;

  function updateSummary() {
    const qty = parseFloat(document.getElementById('quantity').value) || 0;
    const total = qty * currentPrice;
    document.getElementById('summary-price').textContent = fmtPrice(currentPrice);
    document.getElementById('summary-total').textContent = fmtMoney(total, baseCurrency);
    document.getElementById('summary-cash').textContent = fmtMoney(cashBalance, baseCurrency);
  }

  function setSide(newSide) {
    side = newSide;
    document.getElementById('buy-tab').className = side === 'buy' ? 'active-buy' : '';
    document.getElementById('sell-tab').className = side === 'sell' ? 'active-sell' : '';
    const submitBtn = document.getElementById('submit-order');
    submitBtn.className = `btn btn-block ${side === 'buy' ? 'btn-buy' : 'btn-sell'}`;
    submitBtn.textContent = side === 'buy' ? 'Review & place buy order' : 'Review & place sell order';
  }

  document.getElementById('buy-tab').addEventListener('click', () => setSide('buy'));
  document.getElementById('sell-tab').addEventListener('click', () => setSide('sell'));
  document.getElementById('quantity').addEventListener('input', updateSummary);

  document.getElementById('submit-order').addEventListener('click', async () => {
    const banner = document.getElementById('error-banner');
    banner.classList.remove('show');
    const qty = parseFloat(document.getElementById('quantity').value);
    if (!(qty > 0)) {
      banner.textContent = 'Enter a quantity greater than zero.';
      banner.classList.add('show');
      return;
    }
    try {
      const result = await api('/api/orders', {
        method: 'POST',
        body: JSON.stringify({ symbol, side, quantity: qty }),
      });
      cashBalance = result.cashBalance;
      updateSummary();
      showToast(`${side === 'buy' ? 'Bought' : 'Sold'} ${qty} ${symbol} at ${fmtPrice(result.fillPrice)}`, 'success');
      document.getElementById('quantity').value = '';
    } catch (err) {
      banner.textContent = err.message;
      banner.classList.add('show');
    }
  });

  async function refreshPrice() {
    const { markets } = await api('/api/markets');
    const market = markets.find((m) => m.symbol === symbol);
    if (!market) return;
    currentPrice = market.price;
    document.getElementById('symbol-heading').textContent = `${market.symbol} — ${market.name}`;
    document.getElementById('symbol-sub').textContent = `${CATEGORY_LABELS[market.category]} · ${market.region}`;
    document.getElementById('live-price').textContent = fmtPrice(market.price);
    const changeEl = document.getElementById('live-change');
    changeEl.textContent = fmtPct(market.changePct) + ' since session start';
    changeEl.className = `stat-delta mono ${market.changePct >= 0 ? 'up' : 'down'}`;
    updateSummary();
  }

  (async function init() {
    const user = await renderShell('/markets.html');
    if (!user) return;
    baseCurrency = user.baseCurrency;
    const portfolio = await api('/api/portfolio');
    cashBalance = portfolio.cashBalance;
    await refreshPrice();
    setInterval(refreshPrice, 3000);
  })();
</script>
</body>
</html>
