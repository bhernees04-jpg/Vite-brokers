<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markets — Meridian</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <main class="main">
    <div class="topline">
      <div>
        <h1>Markets</h1>
        <div class="sub">Crypto, FX, stocks, gold, crude oil and other commodities.</div>
      </div>
    </div>

    <div class="category-tabs" id="category-tabs">
      <button class="category-tab active" data-cat="all">All</button>
      <button class="category-tab" data-cat="crypto">Crypto</button>
      <button class="category-tab" data-cat="fx">FX</button>
      <button class="category-tab" data-cat="stocks">Stocks</button>
      <button class="category-tab" data-cat="commodities">Commodities</button>
    </div>

    <div class="card">
      <table class="market-table" id="market-table">
        <thead><tr><th>Symbol</th><th>Category</th><th>Region</th><th>Price</th><th>24h</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  let allMarkets = [];
  let activeCat = 'all';

  function render() {
    const rows = allMarkets.filter((m) => activeCat === 'all' || m.category === activeCat);
    const tbody = document.querySelector('#market-table tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><h3>No assets here</h3></div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows
      .map(
        (m) => `
      <tr onclick="window.location.href='/trade.html?symbol=${encodeURIComponent(m.symbol)}'">
        <td class="sym">${m.symbol}<div class="region-tag">${m.name}</div></td>
        <td><span class="pill pill-cat">${CATEGORY_LABELS[m.category]}</span></td>
        <td class="region-tag">${m.region}</td>
        <td class="mono">${fmtPrice(m.price)}</td>
        <td class="mono ${m.changePct >= 0 ? 'up' : 'down'}">${fmtPct(m.changePct)}</td>
      </tr>`
      )
      .join('');
  }

  async function refresh() {
    const { markets } = await api('/api/markets');
    allMarkets = markets;
    render();
  }

  document.getElementById('category-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.category-tab');
    if (!btn) return;
    document.querySelectorAll('.category-tab').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    render();
  });

  (async function init() {
    const user = await renderShell('/markets.html');
    if (!user) return;
    await refresh();
    setInterval(refresh, 4000);
  })();
</script>
</body>
</html>
